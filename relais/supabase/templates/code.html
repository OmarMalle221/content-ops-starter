<!-- Courriel de connexion : aucun renseignement personnel autre que le code. -->
<html lang="fr-CA">
    <body style="font-family: Arial, sans-serif; font-size: 17px; line-height: 1.5; color: #13262b">
        <p>Bonjour,</p>
        <p>Voici votre code de connexion à Relais :</p>
        <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>
        <p>Il est valide 10 minutes. Si vous n’avez pas demandé ce code, ignorez ce courriel.</p>
        <p>Relais n’est pas un service d’urgence. Si quelqu’un est en danger, appelez le 911.</p>
    </body>
</html>
