# ─────────────────────────────────────────────────────────────────────────────
# Diaspora Financial Network — sandbox stack. SANDBOX ONLY: Données fictives — Aucun fonds réel.
#
# No secret has a default value here: copy .env.example to .env and set at least POSTGRES_PASSWORD,
# POSTGRES_APP_PASSWORD, REDIS_PASSWORD, SESSION_SECRET and DOCUMENT_ENCRYPTION_KEY
# (see docs/operations/RUNBOOK.md).
#
#   docker compose up -d --build                  web http://localhost:3000 · api http://localhost:4000/docs
#   docker compose --profile s3 up -d --build     + SeaweedFS S3 (set STORAGE_DRIVER=s3, S3_* in .env)
#   docker compose --profile seed run --rm seed   demo data (fictitious)
#   docker compose --profile observability up -d  + Prometheus http://127.0.0.1:9090 · Alertmanager :9093 · Grafana :3001
#                                                 · Jaeger :16686 (traces: OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318)
#                                                 (set METRICS_TOKEN and GRAFANA_ADMIN_PASSWORD in .env;
#                                                 docs/operations/OBSERVABILITY.md)
#
# Start order: postgres/redis healthy → migrate (prisma migrate deploy, one-shot) → api healthy → web.
# The API runs with JOBS_DRIVER=bullmq and RATE_LIMIT_STORE=redis, so it can be scaled to several
# replicas (drop the 4000 host port mapping first; web reaches the replicas through http://api:4000).
# ─────────────────────────────────────────────────────────────────────────────
name: dfn-sandbox

# Owner (superuser of the postgres image): migrations and the seed only.
x-database-url: &database-url 'postgresql://${POSTGRES_USER:-dfn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dfn}?schema=public'
# Runtime role of the API: data access only, no DDL (infra/postgres/initdb/10-app-role.sh).
x-app-database-url: &app-database-url 'postgresql://${POSTGRES_APP_USER:-dfn_app}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dfn}?schema=public'

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dfn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dfn}
      # Read by initdb/10-app-role.sh on the first initialisation of the volume only.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-dfn_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF on (SECURITY.md §12); noeviction is required by BullMQ; password mandatory.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    volumes: ['redisdata:/data']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  # Optional S3-compatible document storage (profile "s3"): SeaweedFS (Apache-2.0; MinIO no longer
  # publishes public images). The image is overridable (S3_SERVER_IMAGE). Compose interpolates every
  # service, even outside its profile, so the credentials are checked when the container starts
  # (no default secret). Two identities, generated at start from .env: an administrator
  # (S3_ADMIN_*) and the API user (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY) limited to the objects
  # of S3_BUCKET; anonymous requests are refused. Only the S3 port is published, on loopback.
  s3:
    image: ${S3_SERVER_IMAGE:-chrislusf/seaweedfs:4.48}
    profiles: [s3]
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for v in S3_ADMIN_ACCESS_KEY_ID S3_ADMIN_SECRET_ACCESS_KEY S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
          eval "val=\$$$$v"
          case "$$val" in
            ''|*[!A-Za-z0-9._~+/=-]*) echo "$$v must be set in .env (profile s3; letters, digits and ._~+/=- only)" >&2; exit 1 ;;
          esac
        done
        if [ "$${#S3_ADMIN_SECRET_ACCESS_KEY}" -lt 12 ] || [ "$${#S3_SECRET_ACCESS_KEY}" -lt 12 ]; then
          echo "S3_ADMIN_SECRET_ACCESS_KEY and S3_SECRET_ACCESS_KEY must be at least 12 characters" >&2; exit 1
        fi
        if [ "$$S3_ADMIN_ACCESS_KEY_ID" = "$$S3_ACCESS_KEY_ID" ]; then
          echo "S3_ADMIN_ACCESS_KEY_ID and S3_ACCESS_KEY_ID must differ" >&2; exit 1
        fi
        case "$$S3_BUCKET" in
          ''|*[!a-z0-9.-]*) echo "S3_BUCKET must be a lowercase bucket name" >&2; exit 1 ;;
        esac
        umask 077
        cat > /run/dfn-s3.json <<EOF
        {"identities":[
          {"name":"dfn-admin","credentials":[{"accessKey":"$$S3_ADMIN_ACCESS_KEY_ID","secretKey":"$$S3_ADMIN_SECRET_ACCESS_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"dfn-api","credentials":[{"accessKey":"$$S3_ACCESS_KEY_ID","secretKey":"$$S3_SECRET_ACCESS_KEY"}],"actions":["Read:$$S3_BUCKET","Write:$$S3_BUCKET","List:$$S3_BUCKET"]}
        ]}
        EOF
        chown seaweed:seaweed /run/dfn-s3.json
        unset S3_ADMIN_SECRET_ACCESS_KEY S3_SECRET_ACCESS_KEY
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -s3.config=/run/dfn-s3.json
    environment:
      S3_ADMIN_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:-}
      S3_ADMIN_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dfn-documents}
    ports: ['127.0.0.1:8333:8333']
    volumes: ['s3data:/data']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
    restart: unless-stopped

  # One-shot bucket bootstrap (idempotent): creates S3_BUCKET through the cluster's internal
  # shell (not published outside the compose network), then checks it exists.
  s3-init:
    image: ${S3_SERVER_IMAGE:-chrislusf/seaweedfs:4.48}
    profiles: [s3]
    depends_on:
      s3: { condition: service_healthy }
    environment:
      S3_BUCKET: ${S3_BUCKET:-dfn-documents}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        list() { echo "s3.bucket.list" | weed shell -master=s3:9333 2>/dev/null | awk '{print $$1}'; }
        if ! list | grep -qx "$$S3_BUCKET"; then
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=s3:9333
        fi
        list | grep -qx "$$S3_BUCKET" || { echo "bucket $$S3_BUCKET could not be created" >&2; exit 1; }
        echo "bucket $$S3_BUCKET ready (private; API user restricted to it)"
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  # One-shot: applies pending Prisma migrations with the API image, then exits 0.
  migrate:
    build: *api-build
    image: dfn-api:${DFN_IMAGE_TAG:-local}
    <<: *hardening
    command:
      [
        'node',
        '/app/node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--schema',
        'prisma/schema.prisma',
      ]
    environment:
      DATABASE_URL: *database-url
    tmpfs: ['/tmp:size=64m']
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
    restart: 'no'

  api:
    build: *api-build
    image: dfn-api:${DFN_IMAGE_TAG:-local}
    <<: *hardening
    env_file: [.env]
    environment:
      DFN_MODE: sandbox
      NODE_ENV: production
      DATABASE_URL: *app-database-url
      # .env also feeds the infrastructure containers: their credentials stay out of the API
      # process (it uses the least-privilege S3_* user and the runtime database role).
      POSTGRES_PASSWORD: ''
      POSTGRES_APP_PASSWORD: ''
      REDIS_PASSWORD: ''
      S3_ADMIN_ACCESS_KEY_ID: ''
      S3_ADMIN_SECRET_ACCESS_KEY: ''
      GRAFANA_ADMIN_USER: ''
      GRAFANA_ADMIN_PASSWORD: ''
      ALERT_WEBHOOK_URL: ''
      ALERT_WEBHOOK_URL_CRITICAL: ''
      ALERT_WATCHDOG_URL: ''
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      JOBS_DRIVER: bullmq
      RATE_LIMIT_STORE: redis
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?set DOCUMENT_ENCRYPTION_KEY in .env}
      API_PORT: '4000'
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dfn-documents}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      REQUIRE_STAFF_MFA: ${REQUIRE_STAFF_MFA:-false}
    tmpfs: ['/tmp:size=64m']
    volumes: ['storage:/data/storage']
    # Loopback only: browsers go through the web app (/api proxy); a public deployment puts a
    # reverse proxy in front and sets TRUST_PROXY to that proxy (docs/operations/RUNBOOK.md).
    ports: ['127.0.0.1:${API_HOST_PORT:-4000}:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully, required: false }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: 'http://api:4000' }
    image: dfn-web:${DFN_IMAGE_TAG:-local}
    <<: *hardening
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_DFN_MODE: sandbox
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dfn_session}
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      # 0: browsers reach this container directly, the socket address is the client address.
      # Behind N reverse proxies (and reachable through them only), set N.
      WEB_TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:-0}
    tmpfs:
      - /tmp:size=64m
      - /app/apps/web/.next/cache:size=128m,uid=10001,gid=10001,mode=0700
    # Loopback by default, like the API: the sandbox defaults (http, localhost origins) are not
    # meant for a network. WEB_HOST_BIND=0.0.0.0 exposes it on purpose (RUNBOOK).
    ports: ['${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/dashboard',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 20s
    logging: *logging
    restart: unless-stopped

  # Demo data (profile "seed"): runs prisma/seed.ts from the API build stage (dev tools included).
  seed:
    profiles: [seed]
    build:
      <<: *api-build
      target: build
    image: dfn-api-tools:${DFN_IMAGE_TAG:-local}
    user: '10001:10001'
    working_dir: /repo/packages/database
    command: ['node_modules/.bin/tsx', 'prisma/seed.ts']
    environment:
      DATABASE_URL: *database-url
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      # Same key material as the api service: the seed seals beneficiary identifiers and the webhook
      # secret with the key ring, the API must be able to open them.
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?set DOCUMENT_ENCRYPTION_KEY in .env}
      ENCRYPTION_KEYRING: ${ENCRYPTION_KEYRING:-}
      HOME: /tmp
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging
    restart: 'no'

  # Metrics (profile "observability"): Prometheus scrapes every API replica (Docker DNS returns one
  # A record per replica of the `api` service) at GET /metrics with the bearer METRICS_TOKEN of .env
  # (the API reads the same variable through env_file); Grafana is provisioned with the datasource
  # and the dashboard of infra/observability/grafana. Both listen on loopback only. No default
  # credential: the containers refuse to start without METRICS_TOKEN (Prometheus) and
  # GRAFANA_ADMIN_PASSWORD (Grafana) — checked at start, like the S3 server, because Compose interpolates
  # every service even outside its profile. Image references are overridable (PROMETHEUS_IMAGE /
  # GRAFANA_IMAGE).
  #
  # The token reaches Prometheus as a container variable that the entrypoint writes to a tmpfs file
  # (/run/secrets/metrics_token, the credentials_file of prometheus.yml, mode 0600) and then drops:
  # it is never a flag, never an environment variable of the Prometheus process, never written in
  # prometheus.yml nor on disk. A Compose `secrets:` entry sourced from `environment:` would read
  # the same way but cannot be used here: Compose injects such a secret by copying it into the
  # created container, which a read-only root filesystem (x-hardening) refuses ("`file` is the sole
  # supported option"), and a `file:` secret would mean a second copy of the token to keep in step
  # with .env.
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    profiles: [observability]
    <<: *hardening
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        if [ -z "$$METRICS_TOKEN" ]; then
          echo "METRICS_TOKEN must be set in .env (profile observability): Prometheus authenticates to GET /metrics with it" >&2
          exit 1
        fi
        umask 077
        printf '%s' "$$METRICS_TOKEN" > /run/secrets/metrics_token
        unset METRICS_TOKEN
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time="$$PROMETHEUS_RETENTION" \
          --web.listen-address=0.0.0.0:9090
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    # Writable by the image's user (nobody) whatever the override of PROMETHEUS_IMAGE; the file
    # itself is 0600 (umask above).
    tmpfs: ['/run/secrets:size=64k,mode=1777']
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090']
    depends_on:
      api: { condition: service_healthy }
      alertmanager: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    restart: unless-stopped

  # Notifications of the alerts (routing: infra/observability/alertmanager/alertmanager.yml).
  # Destinations come from .env and are written to tmpfs files at start (never into the config):
  # ALERT_WEBHOOK_URL (team), ALERT_WEBHOOK_URL_CRITICAL (on call, default ALERT_WEBHOOK_URL) and
  # ALERT_WATCHDOG_URL (dead man's switch). An unset destination removes its webhook from the
  # rendered config: alerts stay visible at http://127.0.0.1:9093 and the container states at start
  # that nobody is notified. Single instance (no cluster gossip). Image overridable
  # (ALERTMANAGER_IMAGE).
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.29.0}
    profiles: [observability]
    <<: *hardening
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        check_url() {
          case "$$2" in
            http://?*|https://?*) ;;
            *) echo "$$1 must be an http(s) URL" >&2; exit 1 ;;
          esac
        }
        umask 077
        drop=''
        if [ -n "$$ALERT_WEBHOOK_URL" ]; then
          check_url ALERT_WEBHOOK_URL "$$ALERT_WEBHOOK_URL"
          printf '%s' "$$ALERT_WEBHOOK_URL" > /run/alertmanager/webhook_url
          critical="$${ALERT_WEBHOOK_URL_CRITICAL:-$$ALERT_WEBHOOK_URL}"
          check_url ALERT_WEBHOOK_URL_CRITICAL "$$critical"
          printf '%s' "$$critical" > /run/alertmanager/webhook_url_critical
        else
          if [ -n "$$ALERT_WEBHOOK_URL_CRITICAL" ]; then
            echo "ALERT_WEBHOOK_URL_CRITICAL is set without ALERT_WEBHOOK_URL" >&2; exit 1
          fi
          echo "WARNING: ALERT_WEBHOOK_URL is not set: alerts are shown at http://127.0.0.1:9093 but NOBODY IS NOTIFIED" >&2
          drop="$$drop/# webhook$$/d;/# webhook-critical$$/d;"
        fi
        if [ -n "$$ALERT_WATCHDOG_URL" ]; then
          check_url ALERT_WATCHDOG_URL "$$ALERT_WATCHDOG_URL"
          printf '%s' "$$ALERT_WATCHDOG_URL" > /run/alertmanager/watchdog_url
        else
          echo "WARNING: ALERT_WATCHDOG_URL is not set: no dead man's switch watches the alerting pipeline" >&2
          drop="$$drop/# watchdog$$/d;"
        fi
        sed "$$drop" /etc/alertmanager/alertmanager.yml > /run/alertmanager/alertmanager.yml
        unset ALERT_WEBHOOK_URL ALERT_WEBHOOK_URL_CRITICAL ALERT_WATCHDOG_URL critical
        exec /bin/alertmanager \
          --config.file=/run/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.listen-address=0.0.0.0:9093 \
          --web.external-url=http://127.0.0.1:$${ALERTMANAGER_HOST_PORT} \
          --cluster.listen-address=
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL_CRITICAL: ${ALERT_WEBHOOK_URL_CRITICAL:-}
      ALERT_WATCHDOG_URL: ${ALERT_WATCHDOG_URL:-}
      ALERTMANAGER_HOST_PORT: ${ALERTMANAGER_HOST_PORT:-9093}
    # Writable by the image's user (nobody); the files are 0600 (umask above).
    tmpfs: ['/run/alertmanager:size=64k,mode=1777']
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports: ['127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9093/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    restart: unless-stopped

  # Trace backend: Jaeger all-in-one, in-memory storage (traces are lost at restart: sandbox
  # only). OTLP/HTTP is received on the compose network only (http://jaeger:4318, not published);
  # the API exports there when OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 is set in .env.
  # UI and query API on loopback (JAEGER_HOST_PORT). Image overridable (JAEGER_IMAGE); 2.20 is the
  # last release serving the HTTP query API Grafana's Jaeger datasource uses (2.21 answers 404).
  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger:2.20.0}
    profiles: [observability]
    <<: *hardening
    tmpfs: ['/tmp:size=16m']
    ports: ['127.0.0.1:${JAEGER_HOST_PORT:-16686}:16686']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:13133/status']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1}
    profiles: [observability]
    <<: *hardening
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        : "$${GF_SECURITY_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env (profile observability)}"
        if [ "$${#GF_SECURITY_ADMIN_PASSWORD}" -lt 12 ]; then
          echo "GRAFANA_ADMIN_PASSWORD must be at least 12 characters" >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dfn-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      # No outbound calls to grafana.com at start: no background install of the preinstalled apps
      # (the read-only container could not keep them anyway) and no plugin signing-key download.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: 'true'
      # Console only: the root filesystem is read-only (no /var/log/grafana).
      GF_LOG_MODE: console
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_HOST_PORT:-3001}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    tmpfs: ['/tmp:size=64m']
    ports: ['127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000']
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  s3data:
  prometheusdata:
  alertmanagerdata:
  grafanadata:
