name: Relais CI

on:
  push:
    paths: ['relais/**', '.github/workflows/relais.yml']
  pull_request:
    paths: ['relais/**', '.github/workflows/relais.yml']

permissions:
  contents: read

concurrency:
  group: relais-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: relais

jobs:
  checks:
    name: Format, lint, types, unit & component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relais/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:reference
      - run: npm test
      - run: npm run check:bundle

  database:
    name: Supabase schema & RLS tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relais_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relais_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/test-db.sh

  functions:
    name: Edge functions under Deno (type check, real run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les vraies fonctions (deno-server.ts, client Supabase) contre le faux Supabase et la base migrée.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relais_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relais_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relais/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: relais/.tmp/deno
          key: deno-2.9.6-${{ hashFiles('relais/supabase/functions/import_map.json') }}
      - run: npm run check:functions
      - run: npm run test:functions

  e2e:
    name: Build, end-to-end, axe & Lighthouse (mobile)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 35
    # Les données des tests de bout en bout passent par la vraie base migrée (RLS réelle).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relais_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relais_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relais/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relais-playwright-report
          path: relais/playwright-report
          retention-days: 7
